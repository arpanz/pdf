name: batch_pdf_pro
description: "Military-grade encryption, zero-server privacy, and lightning-fast PDF processing. Your files never leave your device."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # File handling
  file_picker: ^10.3.10
  path_provider: ^2.1.3
  path: ^1.9.0
  
  # Share functionality
  share_plus: ^12.0.1
  
  # PDF viewing
  pdfx: ^2.6.0
  
  # UI components
  flutter_staggered_animations: ^1.1.1
  shimmer: ^3.0.0
  
  # Ads
  google_mobile_ads: ^7.0.0
  
  # In-app purchases
  in_app_purchase: ^3.2.0
  
  # State management
  provider: ^6.1.2
  
  # Permissions
  permission_handler: ^12.0.1
  
  # Image handling for PDF to Image
  image: ^4.2.0
  
  # UUID for unique file naming
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  ffigen: ^20.1.1

flutter:
  uses-material-design: true
